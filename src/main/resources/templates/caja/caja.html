<!DOCTYPE html>
<html lang="es-AR" xmlns:th="https://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <link rel="stylesheet" href="/css/caja.css">
    <title>Caja</title>
</head>

<body>

    <div layout:fragment="contenido" class="list-container">

        <h2>CAJA</h2>

        <!-- FILTROS -->
        <form method="get" class="row g-3 mb-4">
            <div class="col-md-3">
                <label>Desde</label>
                <input type="date" name="desde" class="form-control" th:value="${desde}">
            </div>

            <div class="col-md-3">
                <label>Hasta</label>
                <input type="date" name="hasta" class="form-control" th:value="${hasta}">
            </div>

            <div class="col-md-3">
                <label>Tipo de movimiento</label>
                <select name="tipo" class="form-select">
                    <option value="" th:selected="${tipo == null || tipo.isBlank()}">Todos</option>
                    <option value="CUOTA" th:selected="${tipo == 'CUOTA'}">Pago de cuota</option>
                    <option value="INSCRIPCION" th:selected="${tipo == 'INSCRIPCION'}">Pago de inscripción</option>
                    <option value="DIARIO" th:selected="${tipo == 'DIARIO'}">Pago diario</option>
                </select>
                </select>
            </div>

            <div class="col-md-3">
                <label>Forma de pago</label>
                <select name="formaPago" class="form-select">
                    <option value="" th:selected="${formaPago == null || formaPago.isBlank()}">Todo</option>
                    <option value="EFECTIVO" th:selected="${formaPago == 'EFECTIVO'}">Efectivo</option>
                    <option value="TRANSFERENCIA" th:selected="${formaPago == 'TRANSFERENCIA'}">Transferencia</option>
                </select>
            </div>

            <div class="col-md-12 text-end">
                <button class="boton-nuevo mt-2">Mostrar</button>
                <a th:href="@{/caja/pago-diario}" class="boton-nuevo mt-2">
                  + Pago Diario
                </a>
            </div>
        </form>

        <!-- TABLA -->
        <div class="table-wrapper">
            <table id="tablaCaja">
                <thead>
                    <tr>
                        <th>Actividad</th>
                        <th>Socio</th>
                        <th>Detalle</th>
                        <th>Fecha / Hora</th>
                        <th>Usuario</th>
                        <th>Forma de pago</th>
                        <th>Monto</th>
                        <th sec:authorize="${hasRole('ADMIN')}">Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="m : ${movimientos}">
                        <td data-label="Actividad" th:text="${m.actividad}"></td>
                        <td data-label="Socio" th:text="${m.socioNombreCompleto}"></td>
                        <td data-label="Detalle" th:text="${m.detalle}"></td>
                        <td data-label="Fecha / Hora" th:text="${#temporals.format(m.fechaHora, 'dd/MM/yyyy HH:mm')}">
                        </td>
                        <td data-label="Usuario"
                            th:text="${m.usuarioCreador != null && !m.usuarioCreador.isBlank() ? m.usuarioCreador : 'Sin dato'}"
                            th:title="${m.ipCreacion != null ? 'IP: ' + m.ipCreacion : ''}">
                        </td>
                        <td data-label="Forma de Pago" th:text="${m.formaPago}"></td>
                        <td data-label="Monto" th:text="'$' + ${m.monto}"></td>

                        <td data-label="Acciones" class="acciones" sec:authorize="${hasRole('ADMIN')}">
                            <button type="button" class="btn-accion btn-modificar" data-bs-toggle="modal"
                                data-bs-target="#modalModificarMovimiento"
                                th:attr="data-action=@{/caja/modificar/{id}(id=${m.id},desde=${desde},hasta=${hasta},tipo=${tipo},filtroFormaPago=${formaPago})},data-forma-pago=${m.formaPago},data-monto=${m.monto}">
                                Modificar
                            </button>
                            <a sec:authorize="${hasRole('ADMIN')}" href="#"
                                class="btn-accion btn-eliminar"
                                th:onclick="|confirmarEliminacion('@{/caja/eliminar/{id}(id=${m.id},desde=${desde},hasta=${hasta},tipo=${tipo},formaPago=${formaPago})}')|">
                                Eliminar
                            </a>
                        </td>
                    </tr>
                </tbody>

            </table>
        </div>

        <!-- TOTAL -->
        <div class="text-end mt-4">
            <h3>TOTAL: $<span th:text="${totalFormateado}"></span></h3>
        </div>

        <div class="modal fade" id="modalModificarMovimiento" tabindex="-1" aria-labelledby="modalModificarMovimientoLabel"
            aria-hidden="true" sec:authorize="${hasRole('ADMIN')}">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content modal-caja">
                    <form id="formModificarMovimiento" th:action="@{/caja/modificar/0}" method="post">
                        <div class="modal-header">
                            <h5 class="modal-title" id="modalModificarMovimientoLabel">Modificar movimiento</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                                aria-label="Cerrar"></button>
                        </div>

                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="modalFormaPago" class="form-label">Forma de pago</label>
                                <select id="modalFormaPago" name="formaPago" class="form-select" required>
                                    <option value="EFECTIVO">Efectivo</option>
                                    <option value="TRANSFERENCIA">Transferencia</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="modalMonto" class="form-label">Monto</label>
                                <input type="number" id="modalMonto" name="monto" class="form-control" min="1"
                                    step="1" required>
                            </div>
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn-caja-secundario" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn-caja-primario">Guardar cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <!-- JS -->
    <script th:fragment="js">
        $(document).ready(function () {
            $('#tablaCaja').DataTable();

            const modalModificar = document.getElementById('modalModificarMovimiento');
            const formModificar = document.getElementById('formModificarMovimiento');
            const formaPagoInput = document.getElementById('modalFormaPago');
            const montoInput = document.getElementById('modalMonto');

            if (modalModificar && formModificar && formaPagoInput && montoInput) {
                modalModificar.addEventListener('show.bs.modal', function (event) {
                    const boton = event.relatedTarget;
                    formModificar.action = boton.getAttribute('data-action');
                    formaPagoInput.value = boton.getAttribute('data-forma-pago');
                    montoInput.value = boton.getAttribute('data-monto');
                });
            }
        });
    </script>

</body>

</html>
