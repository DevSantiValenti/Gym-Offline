<!DOCTYPE html>
<html lang="es-AR" xmlns:th="https://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Pago Diario</title>
    <link rel="stylesheet" href="/css/socios-form.css">
</head>

<body>
    <div layout:fragment="contenido">

        <div class="form-container">
            <h2>PAGO DIARIO</h2>

            <form th:action="@{/caja/pago-diario}" method="post">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-row">
                    <div class="form-group">
                        <label class="required">Nombre Completo</label>
                        <input type="text" name="nombreCompleto" placeholder="Nombre del alumno" required
                            maxlength="40">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="required">Monto</label>
                        <input type="number" name="monto" required min="0">
                    </div>

                    <div class="form-group">
                        <label class="required">Forma de pago</label>
                        <select name="formaPago" required>
                            <option value="" disabled selected>Seleccione...</option>
                            <option value="EFECTIVO">Efectivo</option>
                            <option value="TRANSFERENCIA">Transferencia</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-siguiente">
                    REGISTRAR PAGO
                </button>

            </form>
        </div>

    </div>

    <script th:fragment="js"></script>
</body>

</html>
