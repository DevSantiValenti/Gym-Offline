<!DOCTYPE html>
<html lang="es-AR" xmlns:th="https://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Estadísticas</title>

    <link rel="stylesheet" th:href="@{/css/estadisticas.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ===============================
   MOBILE – ESTADÍSTICAS
================================ */

        /* ===============================
   CHARTS – ALTURA RESPONSIVE
================================ */

        .chart-container {
            width: 100%;
            position: relative;
        }

        /* 📱 Mobile */
        @media (max-width: 768px) {
            .chart-container {
                height: 260px;
            }
        }

        /* 💻 Desktop */
        @media (min-width: 769px) {
            .ingresos-chart {
                height: 420px;
                /* 🔥 MÁS ALTO */
            }

            .inscripciones-chart {
                height: 360px;
            }
        }

        @media (min-width: 1024px) {
            .ingresos-chart {
                height: 480px;
            }
        }

        .resumen-card.gastos {
            background: linear-gradient(135deg, #ff4d4d, #ff7676);
            color: white;
        }
    </style>
</head>

<body>

    <div layout:fragment="contenido" class="list-container">

        <h2>ESTADÍSTICAS ANUALES</h2>

        <div class="estadisticas-resumen">
            <div class="resumen-card mejor-mes">
                <h5>Mejor mes del año</h5>
                <p id="mejorMes">—</p>
            </div>

            <div class="resumen-card total-anual">
                <h5>Total anual</h5>
                <p id="totalAnual">$ 0</p>
            </div>
        </div>

        <form method="get" class="row g-3 mb-4">
            <div class="col-md-3">
                <label>Año</label>
                <select name="anio" class="form-select" onchange="this.form.submit()">
                    <option th:each="a : ${anios}" th:value="${a}" th:text="${a}"
                        th:selected="${a == anioSeleccionado}">
                    </option>
                </select>
            </div>
        </form>

        <div class="table-wrapper chart-container ingresos-chart">
            <canvas id="barChart"></canvas>
        </div>

        <!-- Chart de las inscripciones en el año, por mes -->
        <div class="table-wrapper chart-container inscripciones-chart" style="margin-top:24px;">
            <canvas id="inscripcionesChart"></canvas>
        </div>

        <!-- Gastos -->
        <div class="table-wrapper chart-container ingresos-chart" style="margin-top:32px;">
            <canvas id="balanceChart"></canvas>
        </div>


    </div>

    <!-- ⚠️ TODO EL JS VA DENTRO DEL FRAGMENTO -->
    <th:block th:fragment="js">

        <script th:inline="javascript">
            /*<![CDATA[*/
            window.labels = /*[[${meses}]]*/[];
            window.dataValues = /*[[${totales}]]*/[];
            window.inscripciones = /*[[${inscripcionesCounts}]]*/[];
            window.gastos = /*[[${gastos}]]*/[];
            /*]]>*/
        </script>

        <script th:src="@{/js/estadisticas.js}"></script>

    </th:block>

</body>

</html>
